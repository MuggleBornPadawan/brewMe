# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start window/pane numbering at 0
set -g base-index 0
set -g pane-base-index 0
set-window-option -g pane-base-index 0
set-option -g renumber-windows on

# --- Dark Theme Colors (Catppuccin Mocha inspired) ---

# Status bar background and text color
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default fg=#a6adc8" 

# Left status: Current Session
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#313244]│ "
set -g status-left-length 100

# Right status: Date & Time
set -g status-right "#[fg=#313244]│ #[fg=#a6adc8]%Y-%m-%d %H:%M "
set -g status-right-length 100

# Active vs Inactive window indicator style
set -g window-status-current-format "#[fg=#cdd6f4,bg=#313244,bold] #I:#W #[default]"
set -g window-status-format "#[fg=#585b70] #I:#W "

# Pane borders (inactive and active)
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Command mode/Message styles
set -g message-style "fg=#cdd6f4,bg=#313244"

# Pi - to make modified Enter keys work
set -g extended-keys on
set -g extended-keys-format csi-u

# --- Tmux Plugins ---
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore when tmux is started
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
